# ───────────────────────────────────────────────────────────────────────
#  Minimal Hyprland config — ported from ~/ubuntu-dots/i3/config
#  Style: Catppuccin Mocha + JetBrainsMono Nerd Font
#  See https://wiki.hyprland.org/Configuring/
# ───────────────────────────────────────────────────────────────────────

# ── Monitors + NVIDIA env ──────────────────────────────────────────────
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/nvidia.conf

# ── Variables ──────────────────────────────────────────────────────────
$mod        = SUPER
$terminal   = kitty
$browser    = zen-browser
$editor     = code
$rofi       = $HOME/.config/rofi/scripts
$rofi_theme = $HOME/.config/rofi/themes/clipboard.rasi

# ── Autostart ──────────────────────────────────────────────────────────
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = hyprpolkitagent
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent.service

# Pre-launch apps onto their pinned workspaces (silent = no focus steal)
exec-once = [workspace 1 silent] kitty
exec-once = [workspace 2 silent] zen-browser
exec-once = [workspace 3 silent] code
exec-once = [workspace 4 silent] slack
exec-once = [workspace 5 silent] thunderbird
exec-once = [workspace 6 silent] discord
exec-once = [workspace 7 silent] obsidian

# ── General appearance ─────────────────────────────────────────────────
general {
    gaps_in              = 6
    gaps_out             = 3
    border_size          = 2
    col.active_border    = rgb(CBA6F7) rgb(B4BEFE) 45deg
    col.inactive_border  = rgb(313244)
    layout               = dwindle
    resize_on_border     = true
    allow_tearing        = false
}

decoration {
    rounding = 8
    blur {
        enabled  = false
    }
    shadow {
        enabled = false
    }
    active_opacity   = 1.0
    inactive_opacity = 1.0
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows,     1, 4, smooth, slide
    animation = windowsOut,  1, 3, smooth, slide
    animation = fade,        1, 5, smooth
    animation = workspaces,  1, 5, smooth, slide
}

input {
    kb_layout      = us
    follow_mouse   = 1
    sensitivity    = 0.0
    accel_profile  = flat
    touchpad {
        natural_scroll = no
    }
}

misc {
    disable_hyprland_logo     = true
    disable_splash_rendering  = true
    mouse_move_enables_dpms   = true
    key_press_enables_dpms    = true
    vfr                       = true
    focus_on_activate         = false
}

dwindle {
    pseudotile        = true
    preserve_split    = true
    smart_split       = false
    force_split       = 2
}

# ── Workspace pinning (app → workspace) ────────────────────────────────
# Browser
windowrulev2 = workspace 2 silent, class:^(zen-alpha|zen-browser|firefox|Firefox)$
# Editor
windowrulev2 = workspace 3 silent, class:^([Cc]ode|code-oss|Code - OSS|Cursor)$
# Slack
windowrulev2 = workspace 4 silent, class:^([Ss]lack)$
# Email
windowrulev2 = workspace 5 silent, class:^([Tt]hunderbird|Mail|Geary|Evolution)$
# Discord
windowrulev2 = workspace 6 silent, class:^([Dd]iscord|WebCord|vesktop|ArmCord)$
# Obsidian
windowrulev2 = workspace 7 silent, class:^([Oo]bsidian)$
# Music / media
windowrulev2 = workspace 8 silent, class:^([Ss]potify|YoutubeMusic|youtube-music)$

# ── Window-behavior rules (from i3 for_window) ─────────────────────────
windowrulev2 = float, class:^([Pp]avucontrol)$
windowrulev2 = float, class:^([Nn]m-connection-editor)$
windowrulev2 = float, class:^(zen-tab-switcher)$
windowrulev2 = center 1, class:^(zen-tab-switcher)$
windowrulev2 = float, title:^(Open File|Save File|Open Folder|Save As)$
windowrulev2 = float, class:^(file-roller|xarchiver)$
# All true dialogs/popups float
windowrulev2 = float, floating:0, class:^(.*)$, title:^(.*) — Dialog$

# Idle inhibit for fullscreen video
windowrulev2 = idleinhibit fullscreen, fullscreen:1

# ═══════════════════════════════════════════════════════════════════════
#  KEYBINDINGS — all 84 ported from ~/ubuntu-dots/i3/config
# ═══════════════════════════════════════════════════════════════════════

# ── Apps ───────────────────────────────────────────────────────────────
bind = $mod,       Return, exec, $terminal
bind = $mod SHIFT, q,      killactive,
bind = ALT,        F4,     killactive,

# ── Rofi menus ─────────────────────────────────────────────────────────
bind = $mod,       SPACE,    exec, $rofi/rofilaunch.sh d        # app launcher
bind = $mod,       Tab,      exec, $rofi/rofilaunch.sh w        # window switcher
bind = $mod SHIFT, s,        exec, $rofi/rofilaunch.sh --run    # run command
bind = $mod SHIFT, f,        exec, $rofi/rofilaunch.sh f        # file finder
bind = $mod SHIFT, d,        exec, $rofi/rofi-style-selector.sh
bind = $mod,       F1,       exec, rofi -show keys -theme $rofi_theme
bind = $mod,       c,        exec, $rofi/rofi-clipboard.sh
bind = $mod SHIFT, b,        exec, $rofi/rofi-bluetooth.sh
bind = $mod SHIFT, m,        exec, $rofi/rofi-display.sh
bind = $mod SHIFT, w,        exec, $rofi/rofi-wallpaper.sh
bind = ,           Print,    exec, $rofi/rofi-screenshot.sh
bind = $mod CTRL,  s,        exec, $rofi/rofi-systemd.sh
bind = $mod,       equal,    exec, rofi -show calc -modi calc -no-show-match -no-sort -theme $rofi_theme -calc-command "echo -n '{result}' | wl-copy"
bind = $mod,       period,   exec, rofimoji --action clipboard --skin-tone neutral --selector-args="-theme $rofi_theme"
bind = $mod,       slash,    exec, $rofi/rofi-websearch-v2.sh
bind = $mod,       p,        exec, $rofi/rofi-projects.sh
bind = $mod,       g,        exec, $rofi/rofi-git-profile.sh
bind = $mod,       t,        exec, $rofi/rofi-tmux.sh
bind = $mod SHIFT, o,        exec, $rofi/rofi-bookmarks.sh
bind = $mod,       grave,    exec, $rofi/zen-tab-popup.sh
bind = $mod SHIFT, t,        exec, $rofi/zen-workspaces.sh
bind = $mod,       n,        exec, $rofi/rofi-obsidian.sh
bind = $mod SHIFT, n,        exec, $rofi/rofi-obsidian-search.sh
bind = $mod,       F2,       exec, $rofi/rofi-keybindings.sh
bind = $mod,       m,        exec, $rofi/rofi-media.sh

# ── Media keys ─────────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume   @DEFAULT_SINK@   +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume   @DEFAULT_SINK@   -5%
bind   = , XF86AudioMute,        exec, pactl set-sink-mute     @DEFAULT_SINK@   toggle
bind   = , XF86AudioMicMute,     exec, pactl set-source-mute   @DEFAULT_SOURCE@ toggle
bind   = , XF86AudioPlay,        exec, playerctl play-pause
bind   = , XF86AudioNext,        exec, playerctl next
bind   = , XF86AudioPrev,        exec, playerctl previous

# Brightness (laptops; harmless on desktop)
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── Lock ───────────────────────────────────────────────────────────────
bind = $mod, Escape, exec, hyprlock

# ── Focus (vim hjkl + arrows) ──────────────────────────────────────────
bind = $mod, h,     movefocus, l
bind = $mod, j,     movefocus, d
bind = $mod, k,     movefocus, u
bind = $mod, l,     movefocus, r
bind = $mod, Left,  movefocus, l
bind = $mod, Down,  movefocus, d
bind = $mod, Up,    movefocus, u
bind = $mod, Right, movefocus, r

# ── Move window (vim + arrows) ─────────────────────────────────────────
bind = $mod SHIFT, h,     movewindow, l
bind = $mod SHIFT, j,     movewindow, d
bind = $mod SHIFT, k,     movewindow, u
bind = $mod SHIFT, l,     movewindow, r
bind = $mod SHIFT, Left,  movewindow, l
bind = $mod SHIFT, Down,  movewindow, d
bind = $mod SHIFT, Up,    movewindow, u
bind = $mod SHIFT, Right, movewindow, r

# ── Layout & split ─────────────────────────────────────────────────────
bind = $mod,       b,     layoutmsg, preselect r       # i3: split h
bind = $mod,       v,     layoutmsg, preselect d       # i3: split v
bind = $mod,       f,     fullscreen, 0                # i3: fullscreen toggle
bind = $mod,       e,     togglesplit,                 # i3: layout toggle split
bind = $mod SHIFT, space, togglefloating,              # i3: floating toggle
bind = $mod,       s,     togglegroup,                 # i3: stacking → groups (closest equivalent)
bind = $mod,       w,     changegroupactive, f         # i3: tabbed → cycle group active
bind = $mod,       a,     focusparent,                 # i3: focus parent
bind = $mod,       z,     togglefloating,              # alias

# ── Pseudotile (Hyprland-specific, useful) ─────────────────────────────
bind = $mod, P, pseudo,

# ── Workspaces 1–10 (= 0 row) ──────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll between workspaces with super+mousewheel
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# ── Mouse ──────────────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── System ─────────────────────────────────────────────────────────────
bind = $mod SHIFT, c, exec, hyprctl reload                # i3: reload
bind = $mod SHIFT, r, exec, hyprctl reload                # i3: restart (closest)
bind = $mod SHIFT, e, exec, $rofi/rofi-power.sh           # power menu
bind = $mod SHIFT, p, exec, systemctl --user restart waybar.service || pkill -SIGUSR2 waybar  # i3: polybar relaunch
bind = $mod,       Delete, exit,                          # immediate hyprland exit

# ── Resize submap (i3 "mode") ──────────────────────────────────────────
bind = $mod, r, submap, resize
submap = resize
binde = , h,     resizeactive, -20 0
binde = , j,     resizeactive, 0 20
binde = , k,     resizeactive, 0 -20
binde = , l,     resizeactive, 20 0
binde = , Left,  resizeactive, -20 0
binde = , Down,  resizeactive, 0 20
binde = , Up,    resizeactive, 0 -20
binde = , Right, resizeactive, 20 0
bind  = , Return, submap, reset
bind  = , Escape, submap, reset
bind  = $mod, r,  submap, reset
submap = reset
